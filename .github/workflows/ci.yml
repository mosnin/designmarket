name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`, so a lockfile that has drifted out
      # of sync with package.json fails here instead of on a deploy.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # These cover the rules the catalogue is built on — that no figure is
      # authored, that an install plan is derived rather than guessed, and that
      # a score built on little evidence says so. Each one has been checked by
      # breaking the thing it guards and watching it fail.
      - name: Test
        run: npm test

      # The build runs with no environment configured on purpose: the app is
      # meant to be browsable with no Convex deployment, and this is what
      # proves it still is.
      - name: Build
        run: npm run build
